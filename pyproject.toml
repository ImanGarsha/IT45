[project]
name = "it45"
version = "0.2.2"
description = "IT45 -- multi-venue automated trader (Hyperliquid, Arcus, Bulk, Reya, Meridian)"
requires-python = ">=3.10"
dependencies = ["fastapi>=0.110", "uvicorn[standard]>=0.29", "httpx>=0.27",
                "hyperliquid-python-sdk>=0.24", "eth-account>=0.10", "pycryptodome>=3.17"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
it45 = "it45.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["it45*"]

[tool.setuptools.package-data]
it45 = ["web/*", "web/assets/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["network: hits a live testnet API (deselect with -m 'not network')"]
